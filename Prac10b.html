<!DOCTYPE html>
<html>
<head>
    <title>Alert Confirm Prompt Example</title>
</head>
<body>

<h2>JavaScript Dialog Boxes Example</h2>

<button onclick="showBoxes()">Click Here</button>

<script>
function showBoxes() {

    // Alert Box
    alert("This is an Alert Box");

    // Confirm Box
    let result = confirm("Do you want to continue?");
    
    if(result == true){
        alert("You clicked OK");
    }
    else{
        alert("You clicked Cancel");
    }

    // Prompt Box
    let name = prompt("Enter your name:");

    if(name != null && name != ""){
        alert("Hello " + name);
    }
    else{
        alert("No name entered");
    }

}
</script>

</body>
</html>
