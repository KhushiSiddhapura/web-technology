<!DOCTYPE html>
<html>
<head>
    <title>Practical 10 (B)</title>
</head>
<body>
    <h1>Click on buttons below!</h1>
    <button onclick="showAlert()">Alert Box</button>
    <button onclick="showConfirm()">Confirm Box</button>
    <button onclick="showPromt()">Prompt Box</button> <br>
    <p id="text"></p>
    <script>
        function showAlert() {
            alert("This is Alert Massage!")
        }
        function showConfirm() {
            let result = confirm("Do you want to see my portfolio?")
            if (result) {
                window.location.href = "https://sites.google.com/bvmengineering.ac.in/khushi-portfolio/"
            } else {
                document.getElementById("text").innerHTML = "You clicked Cancle!"
            }
        }
        function showPromt() {
            let name = prompt("Enter your name:")
                document.getElementById("text").innerHTML = "Hello " + name
        }
    </script>
</body>
</html>
