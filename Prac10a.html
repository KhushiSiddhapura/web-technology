<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <p>Sum: <span class="sum"></span></p>
        <p>Multiplication: <span class="multiply"></span></p>
    </div>
    <script>
        let x = parseInt(prompt("Enter first value: "))
        let y = parseInt(prompt("Enter second value: "))
        document.getElementsByClassName("sum")[0].innerHTML = x+y
        document.getElementsByClassName("multiply")[0].innerHTML = x*y
    </script>
</body>
</html>
