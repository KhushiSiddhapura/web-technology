<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Left Menu</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body,
        html{
            height: 100%;
            width: 100%;
        }
        body{
            background-color: rgb(194, 186, 186);
            margin: 0;
            padding: 0;
        }
        .sidebar{
            display: flex;
            flex-direction: column;
            justify-self: center;
            align-items: center;
            width: 80%;
            gap: 25px;
        }
        .sidebar a{
            text-decoration: none;
            color: rgb(62, 60, 60);
            text-align: center;
            width: 100%;
            padding: 8px;
        }
        .sidebar a:hover{
            color: rgb(165, 165, 173);
            background-color: rgb(62, 60, 60);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="#">Home</a>
        <a href="#">Acedemics</a>
        <a href="#">Department</a>
        <a href="#">Results</a>   
        <a href="#">Courses</a>
        <a href="#">About</a>
        <a href="#">Contact us</a>
    </div>
</body>
</html>
