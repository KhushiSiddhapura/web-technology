<!doctype html>
<html>
  <head>
    <title>Practical 7</title>
    <style>
      body {
        font-family: serif;
        background: #ddd;
      }

      h2 {
        font-weight: normal;
      }

      .margin {
        width: 400px;
        padding: 25px;
        background: #e6b57e;
        position: relative;
      }

      .border {
        padding: 20px;
        background: #f6e7a6;
        border: 2px solid black;
        position: relative;
      }

      .padding {
        padding: 25px;
        background: #a9e3d3;
        border: 2px dashed black;
        position: relative;
      }

      .content {
        background: #7fa2d6;
        padding: 15px;
        text-align: center;
        width: 200px;
        margin: auto;
      }

      .label {
        position: absolute;
        font-size: 14px;
      }

      .margin-label {
        top: 5px;
        left: 10px;
      }

      .border-label {
        top: 5px;
        left: 10px;
      }

      .padding-label {
        top: 5px;
        left: 10px;
      }
    </style>
  </head>
  <body>
    <div class="margin">
      <span class="label margin-label">Margin</span>
      <div class="border">
        <span class="label border-label">Border</span>
        <div class="padding">
          <span class="label padding-label">Padding</span>
          <div class="content">Content</div>
        </div>
      </div>
    </div>
  </body>
</html>
